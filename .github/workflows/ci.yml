name: Verify SaNa Business
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      AI_MODE: fallback
      SANA_LEGACY_MODE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
